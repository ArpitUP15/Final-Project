[project]
name = "autodatagen-backend"
version = "0.2.0"
description = "AutoDataGen FastAPI backend for tabular dataset analysis and augmentation"
requires-python = ">=3.14.3,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "Pillow>=10.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "openpyxl>=3.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
